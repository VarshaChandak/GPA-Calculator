<!DOCTYPE html>
<html lang="en" class="dark-theme">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GPA Calculator — Deep Dark Theme</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      background: #070911;
      font-family: 'Montserrat', sans-serif;
      color: #ccc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body>
</body>
</html>
<body>
  <main id="app" role="main" aria-label="GPA Calculator" style="
    background: #0d0f1a; 
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(50, 35, 75, 0.85);
    max-width: 460px;
    width: 100%;
    padding: 3rem 3.2rem;
    display: flex;
    flex-direction: column;
    gap: 2.3rem;
    user-select: none;
    border: 1.5px solid #1b1c2d;
  ">
    <h1 style="
      margin: 0;
      font-weight: 600;
      font-size: 2.8rem;
      text-align: center;
      color: #9f7ae0;
      letter-spacing: 1.3px;
      text-shadow: 0 0 6px #7151a1aa;
    ">GPA Calculator</h1>
  </main>
</body>
<section id="courses" aria-live="polite" style="display:flex;flex-direction:column;gap:1.7rem;"></section>
<button id="add-course" aria-label="Add new course" style="
  background: #7e61e1;
  color: #ede9ff;
  border: none;
  border-radius: 14px;
  padding: 1rem 0;
  font-weight: 600;
  font-size: 1.25rem;
  cursor: pointer;
  box-shadow: 0 10px 25px #5c3ddaaa;
  transition: background-color 0.3s ease, transform 0.15s ease, box-shadow 0.3s ease;
  user-select: none;
  width: 100%;
  letter-spacing: 0.06em;
  margin-top: 0.5rem;
">+ Add Course</button>

<button id="calculate" aria-label="Calculate GPA" style="
  background: #7e61e1;
  color: #ede9ff;
  border: none;
  border-radius: 14px;
  padding: 1rem 0;
  font-weight: 600;
  font-size: 1.25rem;
  cursor: pointer;
  box-shadow: 0 10px 25px #5c3ddaaa;
  transition: background-color 0.3s ease, transform 0.15s ease, box-shadow 0.3s ease;
  user-select: none;
  width: 100%;
  letter-spacing: 0.06em;
  margin-top: 0.2rem;
">Calculate GPA</button>
