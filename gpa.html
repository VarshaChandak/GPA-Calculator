  <meta charset="UTF-8" />

      display: flex;

      align-items: center;

      padding: 2rem;

<body>
  <main id="app" role="main" aria-label="GPA Calculator" style="
    background: #0d0f1a; 
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(50, 35, 75, 0.85);
    max-width: 460px;
    width: 100%;
    padding: 3rem 3.2rem;
    display: flex;
    flex-direction: column;
    gap: 2.3rem;
    user-select: none;
    border: 1.5px solid #1b1c2d;

      margin: 0;
      font-weight: 600;
      font-size: 2.8rem;
